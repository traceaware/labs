<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Document sorter</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 259 259'%3E%3Ccircle cx='129.5' cy='129.5' r='129.5' fill='%23FF3300'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sorter.css">
</head>
<body>
<main>
  <div class="title-row">
    <h1 class="display">Sort</h1>
    <div class="actions" id="actions" hidden>
      <button class="btn" type="button" id="again">Sort again</button>
      <button class="btn" type="button" id="clear">Clear</button>
    </div>
  </div>

  <div class="notice" id="nokey" role="status" hidden><span class="dot unsure"></span><span>The AI key is not set on the server, so nothing can be sorted.</span></div>

  <div class="inputs">
    <label class="field">
      <span class="head"><b>Producer</b><span>Optional</span></span>
      <input id="producer" type="text" placeholder="Producer name" autocomplete="off">
    </label>
    <label class="drop slim" id="dropSlim" hidden>
      <span>Drop more files</span>
      <input type="file" multiple accept="application/pdf,image/jpeg,image/png">
    </label>
  </div>

  <label class="drop" id="dropBig">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#290800" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    <span class="big">Drop files here</span>
    <span class="hint">PDF, JPG or PNG, up to 20 MB each</span>
    <input type="file" multiple accept="application/pdf,image/jpeg,image/png">
    <span class="btn small" aria-hidden="true">Choose files</span>
  </label>

  <div class="counts" id="counts" aria-live="polite"></div>
  <div class="cards" id="cards"></div>
</main>
<script src="common.js"></script>
<script src="sort.js"></script>
</body>
</html>
